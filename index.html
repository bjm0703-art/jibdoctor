<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>우리 집 닥터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 진료실 카드 4장이 2×2로 놓인 '병원 접수대' 레이아웃. 한 번에 한 화면, 큰 버튼, 태블릿 세로·가로 모두 */
:root{
  --bg:#EEF7F2; --card:#FFFFFF; --ink:#2F3A35; --muted:#5F6F68; --line:#3A3A3A;
  --mint:#9FDBC4; --mint-deep:#2F7D5E; --coral:#F28B82; --yellow:#FFD95E;
  --sky:#CFE3F7; --lav:#D9C8F0; --pink:#F6B8C4; --soft:#F6FBF8;
  --ok:#23885A; --ok-bg:#E3F5EC; --bad:#C8463F; --bad-bg:#FCE9E7;
  --display:'Jua','Gowun Dodum','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:2.1rem;line-height:1.2}
h2{font-size:1.55rem;line-height:1.25}
h3{font-size:1.2rem}
p{margin:0}
.ico{width:64px;height:64px;flex:none}
.ico svg,.big svg{width:100%;height:100%;display:block}
.big{width:150px;height:150px;margin:0 auto}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.tag{display:inline-block;font-family:var(--display);font-size:.95rem;padding:2px 12px;border-radius:999px;border:2px solid var(--line);background:var(--yellow)}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{font-family:var(--display);font-size:1.25rem;padding:12px 22px;border-radius:16px;border:3px solid var(--line);background:var(--mint);box-shadow:0 4px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.sec{background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--coral);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.who{font-family:var(--display);font-size:1rem;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 14px}
/* 접수 */
.hero{text-align:center;align-items:center}
.fields{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px;width:100%}
.fields label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:1rem;text-align:left}
input,select{font:inherit;font-size:1.1rem;padding:10px 12px;border:3px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%;min-width:0}
/* 진료실 목록 */
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.room{position:relative;text-align:left;display:flex;flex-direction:column;gap:8px;padding:16px;border:3px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--line)}
.room .ico{width:58px;height:58px}
.room .rt{font-family:var(--display);font-size:1.35rem}
.room .rp{font-size:.95rem;color:var(--muted)}
.room.done::after{content:"진료 완료";position:absolute;right:12px;top:12px;font-family:var(--display);font-size:.95rem;background:var(--ok);color:#fff;border-radius:999px;padding:2px 10px;transform:rotate(6deg)}
.room.locked{opacity:.55;box-shadow:none}
.c-heat{background:#FDE6E3}.c-light{background:#FFF4CC}.c-air{background:#E5F0FB}.c-sound{background:#EFE7F9}.c-bonus{background:#E3F5EC}
.progress{display:flex;gap:8px;align-items:center;font-family:var(--display)}
.dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);background:#fff}
.dot.on{background:var(--ok)}
/* 진료 화면 */
.patient{display:flex;gap:14px;align-items:center;background:var(--soft);border:2px dashed var(--line);border-radius:18px;padding:14px}
.patient .ico{width:76px;height:76px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:8px;border-radius:99px;background:#D7E4DD}
.steps span.on{background:var(--mint-deep)}
.q{font-size:1.15rem;font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:#fff;font-size:1.05rem;line-height:1.45}
.opt.sel{background:var(--yellow)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.sortitem{display:flex;flex-direction:column;gap:8px;padding:12px;border:2px solid var(--line);border-radius:14px;background:#fff}
.sortitem.wrong{background:var(--bad-bg);border-color:var(--bad)}
.sortitem.right{background:var(--ok-bg);border-color:var(--ok)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:#fff;font-size:1rem}
.chip.sel{background:var(--mint-deep);color:#fff}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairq{font-family:var(--display);font-size:1.05rem}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:3px solid var(--line);border-radius:14px;background:#fff;font-size:1rem;text-align:center}
.pick svg{width:100%;max-width:150px;height:auto}
.pick.sel{background:var(--yellow)}
.pick.right{background:var(--ok-bg);border-color:var(--ok)}
.pick.wrong{background:var(--bad-bg);border-color:var(--bad)}
.gauge{display:flex;flex-direction:column;gap:6px}
.gauge .val{font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums}
input[type=range]{padding:0;border:none;height:36px;accent-color:var(--mint-deep)}
.fb{border-radius:14px;padding:12px 14px;font-size:1.02rem;line-height:1.5}
.fb.ok{background:var(--ok-bg);border:2px solid var(--ok)}
.fb.no{background:var(--bad-bg);border:2px solid var(--bad)}
.fb b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.memo{background:#FFF8D6;border:2px solid var(--line);border-radius:14px;padding:12px 14px}
/* 퀴즈 */
.code{font-family:var(--display);font-size:2.2rem;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums}
.timer{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums;background:#fff;border:2px solid var(--line);border-radius:999px;padding:2px 12px}
/* 증명서 */
.cert{background:#fff;border:4px double var(--line);border-radius:24px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.cert .score{font-family:var(--display);font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.cert .time{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--mint-deep);font-variant-numeric:tabular-nums}
.cert .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.cert .box{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.live{font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums;background:var(--yellow);border:2px solid var(--line);border-radius:999px;padding:2px 14px}
.stamps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.stamps span{font-family:var(--display);border:2px solid var(--line);border-radius:999px;padding:2px 10px;background:#eee}
.stamps span.on{background:var(--mint)}
.foot{text-align:center;font-size:.85rem;color:var(--muted)}
.linkish{background:none;border:none;text-decoration:underline;color:var(--muted);font-size:.85rem}
.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.btn{transition:none}}
@media (max-width:560px){
  .rooms{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr 1fr}
  .fields label:last-child{grid-column:1/-1}
  h1{font-size:1.7rem}
  .cert .grid{grid-template-columns:1fr}
}
</style>

<div class="wrap" id="app"></div>

const START_CODE = "4829";   // 최종 퀴즈 시작 코드 (PPT에만 표시)

/* ---------- 창문 그림 ---------- */
function win(o){ // o: {w,h,frost,roof}
  const W=160,H=120;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#3A3A3A" stroke-width="4" stroke-linejoin="round">`;
  if(o.roof){
    s+=`<path d="M10 70 L80 22 L150 70 Z" fill="#F28B82"/><rect x="24" y="70" width="112" height="44" fill="#fff"/>`;
    s+=`<path d="M70 34 l22 -12 l14 10 l-22 12 z" fill="#CFE3F7"/>`;
    return s+`</svg>`;
  }
  if(o.wall){
    s+=`<path d="M10 70 L80 22 L150 70 Z" fill="#F28B82"/><rect x="24" y="70" width="112" height="44" fill="#fff"/>`;
    s+=`<rect x="64" y="78" width="32" height="26" fill="#CFE3F7"/>`;
    return s+`</svg>`;
  }
  s+=`<rect x="4" y="4" width="152" height="112" rx="8" fill="#F3EFE6"/>`;
  const x=(W-o.w)/2,y=(H-o.h)/2;
  s+=`<rect x="${x}" y="${y}" width="${o.w}" height="${o.h}" fill="${o.frost?'#E6E9EC':'#CFE3F7'}"/>`;
  if(o.frost){for(let i=0;i<8;i++)s+=`<circle cx="${x+6+Math.random()*(o.w-12)}" cy="${y+6+Math.random()*(o.h-12)}" r="3" fill="#fff" stroke="none"/>`;}
  else s+=`<path d="M${x+8} ${y+o.h-10} l${Math.min(20,o.w/3)} -${Math.min(20,o.h/3)}" stroke="#fff" stroke-width="5"/>`;
  s+=`<rect x="${x}" y="${y}" width="${o.w}" height="${o.h}"/>`;
  return s+`</svg>`;
}

const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = (a)=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const allDone = ()=>ROOMS.every(r=>S.done[r.id]);
let tick = null;
function stopTick(){ if(tick){clearInterval(tick);tick=null;} }

/* ---------- 화면: 접수 ---------- */
function viewStart(){
  stopTick();
  h(`<div class="card hero pop">
      <div class="big">${ICONS.doctor}</div>
      <span class="tag">교과서 86~89쪽 · 쾌적한 주거 환경의 조건</span>
      <h1>우리 집 닥터</h1>
      <p>오늘 여러분은 <b>집 의사</b>예요. 열·빛·공기·소리 진료실 4곳을 돌며 아픈 집을 고쳐 주세요.<br>막히면 화면의 <b>교과서 쪽 힌트</b>를 따라가면 돼요.</p>
      <div class="fields">
        <label for="f-ban">반<input id="f-ban" inputmode="numeric" maxlength="2" placeholder="3"></label>
        <label for="f-num">번호<input id="f-num" inputmode="numeric" maxlength="2" placeholder="12"></label>
        <label for="f-name">이름<input id="f-name" maxlength="10" placeholder="홍길동"></label>
      </div>
      <button class="btn" id="go">진료 시작하기</button>
      <p class="muted" id="msg"></p>
    </div>`);
  document.getElementById("go").onclick=()=>{
    const ban=document.getElementById("f-ban").value.trim(), num=document.getElementById("f-num").value.trim(), nm=document.getElementById("f-name").value.trim();
    if(!ban||!num||!nm){ document.getElementById("msg").textContent="반, 번호, 이름을 모두 적어 주세요."; return; }
    S.name={ban,num,nm}; save(); viewHub();
  };
}

/* ---------- 화면: 진료실 목록 ---------- */
function whoTag(){ return S.name?`<span class="who">${esc(S.name.ban)}반 ${esc(S.name.num)}번 ${esc(S.name.nm)}</span>`:""; }
function viewHub(){
  stopTick();
  if(S.quiz && S.quiz.end) return viewCert();
  if(S.quiz && S.quiz.start && !S.quiz.end) return viewQuiz();
  const n=ROOMS.filter(r=>S.done[r.id]).length;
  const card=(r,locked)=>`<button class="room ${r.cls} ${S.done[r.id]?'done':''} ${locked?'locked':''}" data-r="${r.id}" ${locked?'disabled':''}>
      <div class="ico">${ICONS[r.icon]}</div><span class="rt">${r.name}</span><span class="rp">교과서 ${r.page}${r.memo?` · 기록지 ${r.memo}번`:''}</span></button>`;
  h(`<div class="top">${whoTag()}<div class="progress">${ROOMS.map(r=>`<span class="dot ${S.done[r.id]?'on':''}"></span>`).join("")} <span>${n}/4</span></div></div>
     <div class="card">
       <h2>어느 진료실부터 갈까요?</h2>
       <p class="muted">순서는 자유예요. 진료를 마칠 때마다 종이 <b>진료 기록지</b>에 핵심을 적어요.</p>
     </div>
     <div class="rooms">${ROOMS.map(r=>card(r,false)).join("")}</div>
     ${allDone()?`<div class="card hero pop" style="background:var(--ok-bg)"><div class="big" style="width:110px;height:110px">${ICONS.stamp}</div><h2>명의 인증!</h2><p>진료실 4곳을 모두 마쳤어요. 기록지를 다시 확인하고, 시간이 남으면 보너스 진료실에 가 보세요.</p></div>`:""}
     <div class="rooms">${card(BONUS,!allDone())}
       <button class="room" id="quizbtn" style="background:var(--yellow)"><div class="ico">${ICONS.trophy}</div><span class="rt">최종 진단 퀴즈</span><span class="rp">선생님이 시작 코드를 알려 주면 열려요</span></button>
     </div>
     <p class="foot">진료 기록은 이 태블릿에만 저장돼요. <button class="linkish" id="reset">선생님 전용: 이 기기 초기화</button></p>
     <div id="rbox"></div>`);
  document.getElementById("reset").onclick=()=>askReset("rbox");
  $app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ const r=b.dataset.r==="bonus"?BONUS:ROOMS.find(x=>x.id===b.dataset.r); viewRoom(r,0); });
  document.getElementById("quizbtn").onclick=viewCode;
}

/* ---------- 화면: 진료 ---------- */
function viewRoom(r, i){
  stopTick();
  const st=r.steps[i];
  const bar=r.steps.map((_,k)=>`<span class="${k<=i?'on':''}"></span>`).join("");
  let body="";
  if(st.type==="choice"||st.type==="multi"){
    const order=shuffle(st.opts.map((o,k)=>k));
    body=`<div class="opts">${order.map(k=>`<button class="opt" data-k="${k}">${st.opts[k][0]}</button>`).join("")}</div>`;
  } else if(st.type==="sort"){
    const order=shuffle(st.items.map((o,k)=>k));
    body=order.map(k=>`<div class="sortitem" data-k="${k}"><span>${st.items[k][0]}</span><div class="chips">${st.cats.map((c,ci)=>`<button class="chip" data-c="${ci}">${c}</button>`).join("")}</div></div>`).join("");
  } else if(st.type==="pairs"){
    body=st.rows.map((rw,k)=>`<div class="sortitem" data-k="${k}"><span class="pairq">${rw.label}</span><div class="pair">
      ${["a","b"].map(s=>`<button class="pick" data-s="${s}">${rw[s][0]||""}<span>${rw[s][1]}</span></button>`).join("")}</div></div>`).join("");
  } else if(st.type==="match"){
    const fixes=shuffle(st.items.map(x=>x[1]));
    body=st.items.map((it,k)=>`<div class="sortitem" data-k="${k}"><span><b>${it[0]}</b></span>
      <select id="m-${r.id}-${k}" aria-label="${esc(it[0])} 처방"><option value="">처방 고르기</option>${fixes.map(f=>`<option>${f}</option>`).join("")}</select></div>`).join("");
  } else if(st.type==="fill"){
    body=st.items.map((it,k)=>`<div class="sortitem" data-k="${k}"><div class="row">${it[0]?`<span>${it[0]}</span>`:""}
      <select id="f-${k}" style="width:auto"><option value="">고르기</option>${it[1].map((o,oi)=>`<option value="${oi}">${o}</option>`).join("")}</select><span>${it[3]}</span></div></div>`).join("");
  } else if(st.type==="slider"){
    body=`<div class="row" style="align-items:stretch">
      <div class="ico" id="mood" style="width:90px;height:90px">${ICONS.doctor_sad}</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:12px;min-width:0">
        <div class="gauge"><label for="t">실내 온도</label><span class="val" id="tv">26℃</span><input type="range" id="t" min="10" max="32" step="1" value="26"></div>
        <div class="gauge"><label for="hm">실내 습도</label><span class="val" id="hv">80%</span><input type="range" id="hm" min="20" max="90" step="5" value="80"></div>
      </div></div>`;
  }
  h(`<div class="top"><button class="btn sec" id="back" style="font-size:1rem;padding:6px 14px">← 목록</button>${whoTag()}</div>
     <div class="card ${r.cls}">
       <div class="row"><div class="ico">${ICONS[r.icon]}</div><div><h2>${r.name}</h2><span class="muted">교과서 ${r.page}를 펴 두세요</span></div></div>
       <div class="steps">${bar}</div>
     </div>
     ${i===0?`<div class="patient"><div class="ico">${ICONS.doctor_sad}</div><p>${r.patient}</p></div>`:""}
     <div class="card">
       <p class="q">${st.q}</p>
       ${body}
       <div id="fb"></div>
       <div class="row"><button class="btn" id="chk">진단 확인</button></div>
     </div>`);
  document.getElementById("back").onclick=viewHub;

  // 선택 동작
  if(st.type==="choice") $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ $app.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); });
  if(st.type==="multi") $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>b.classList.toggle("sel"));
  if(st.type==="sort") $app.querySelectorAll(".sortitem").forEach(it=>it.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ it.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel")); c.classList.add("sel"); it.classList.remove("wrong","right"); }));
  if(st.type==="pairs") $app.querySelectorAll(".sortitem").forEach(it=>it.querySelectorAll(".pick").forEach(c=>c.onclick=()=>{ it.querySelectorAll(".pick").forEach(x=>x.classList.remove("sel","right","wrong")); c.classList.add("sel"); }));
  if(st.type==="slider"){
    const t=document.getElementById("t"), hm=document.getElementById("hm");
    const upd=()=>{ document.getElementById("tv").textContent=t.value+"℃"; document.getElementById("hv").textContent=hm.value+"%";
      const good=(+t.value>=18&&+t.value<=20&&+hm.value>=40&&+hm.value<=60);
      document.getElementById("mood").innerHTML=good?ICONS.doctor:ICONS.doctor_sad; };
    t.oninput=upd; hm.oninput=upd;
  }

  document.getElementById("chk").onclick=()=>{
    let ok=true, missing=false;
    if(st.type==="choice"||st.type==="multi"){
      const opts=[...$app.querySelectorAll(".opt")];
      if(!opts.some(o=>o.classList.contains("sel"))) missing=true;
      opts.forEach(o=>{ o.classList.remove("right","wrong"); const good=st.opts[o.dataset.k][1]===1, sel=o.classList.contains("sel");
        if(sel&&!good){o.classList.add("wrong");ok=false;} if(!sel&&good) ok=false; if(sel&&good&&st.type==="choice") o.classList.add("right"); });
      if(ok) opts.forEach(o=>{ if(st.opts[o.dataset.k][1]===1) o.classList.add("right"); });
    } else if(st.type==="sort"){
      $app.querySelectorAll(".sortitem").forEach(it=>{ const s=it.querySelector(".chip.sel"); if(!s){missing=true;ok=false;return;}
        const good=+s.dataset.c===st.items[it.dataset.k][1]; it.classList.toggle("right",good); it.classList.toggle("wrong",!good); if(!good) ok=false; });
    } else if(st.type==="pairs"){
      $app.querySelectorAll(".sortitem").forEach(it=>{ const s=it.querySelector(".pick.sel"); if(!s){missing=true;ok=false;return;}
        const good=s.dataset.s===st.rows[it.dataset.k].ans; s.classList.add(good?"right":"wrong"); if(!good) ok=false; });
    } else if(st.type==="match"){
      $app.querySelectorAll(".sortitem").forEach(it=>{ const v=it.querySelector("select").value; if(!v){missing=true;ok=false;return;}
        const good=v===st.items[it.dataset.k][1]; it.classList.toggle("right",good); it.classList.toggle("wrong",!good); if(!good) ok=false; });
    } else if(st.type==="fill"){
      $app.querySelectorAll(".sortitem").forEach(it=>{ const v=it.querySelector("select").value; if(v===""){missing=true;ok=false;return;}
        const good=+v===st.items[it.dataset.k][2]; it.classList.toggle("right",good); it.classList.toggle("wrong",!good); if(!good) ok=false; });
    } else if(st.type==="slider"){
      const t=+document.getElementById("t").value, hm=+document.getElementById("hm").value;
      ok=(t>=18&&t<=20&&hm>=40&&hm<=60);
    }
    const fb=document.getElementById("fb");
    if(missing && !ok){ fb.innerHTML=`<div class="fb no"><b>아직 고르지 않은 곳이 있어요.</b> 모두 고른 뒤 다시 눌러 주세요.</div>`; return; }
    if(!ok){ fb.innerHTML=`<div class="fb no pop"><b>다시 진단해 볼까요?</b><br>힌트: ${st.hint}</div>`; return; }
    const last=(i===r.steps.length-1);
    fb.innerHTML=`<div class="fb ok pop"><b>정확한 진단이에요!</b><br>${st.explain}</div>`;
    const chk=document.getElementById("chk");
    chk.textContent= last? "진료 마치기" : "다음 진료 →";
    chk.onclick=()=>{ if(last){ S.done[r.id]=true; save(); viewRoomDone(r); } else viewRoom(r,i+1); };
    $app.querySelectorAll(".opt,.chip,.pick,select,input").forEach(x=>x.disabled=true);
  };
}

function viewRoomDone(r){
  h(`<div class="card hero pop ${r.cls}">
      <div class="big">${ICONS.doctor}</div>
      <h1>${r.name} 진료 완료!</h1>
      <p>환자가 다 나았어요.</p>
    </div>
    ${r.memo?`<div class="memo"><b>지금 할 일</b> · 종이 <b>진료 기록지 ${r.memo}번</b> 빈칸을 채워 주세요. 교과서 ${r.page}를 보면 모두 찾을 수 있어요.</div>`:""}
    <button class="btn" id="hub">진료실 목록으로</button>`);
  document.getElementById("hub").onclick=viewHub;
}

/* ---------- 최종 진단 퀴즈 ---------- */
function viewCode(){
  stopTick();
  h(`<div class="top"><button class="btn sec" id="back" style="font-size:1rem;padding:6px 14px">← 목록</button>${whoTag()}</div>
     <div class="card hero">
       <div class="big" style="width:110px;height:110px">${ICONS.trophy}</div>
       <h1>최종 진단 퀴즈</h1>
       <p>모두 <b>동시에</b> 시작해요. 선생님 화면에 나오는 <b>시작 코드 4자리</b>를 넣어 주세요.<br>코드를 넣는 순간부터 시간이 재어지고, <b>한 번만</b> 풀 수 있어요.</p>
       <input id="code" class="code" inputmode="numeric" maxlength="4" placeholder="····" aria-label="시작 코드" style="max-width:240px">
       <button class="btn" id="startq">퀴즈 시작</button>
       <p id="msg" class="muted"></p>
     </div>`);
  document.getElementById("back").onclick=viewHub;
  document.getElementById("startq").onclick=()=>{
    if(!S.name){ viewStart(); return; }
    if(document.getElementById("code").value.trim()!==START_CODE){ document.getElementById("msg").textContent="코드가 달라요. 선생님 화면을 다시 확인해 주세요."; return; }
    const order=QUIZ.map(q=>shuffle(q.opts.map((o,k)=>k)));
    S.quiz={start:Date.now(), order, ans:[], end:null}; save(); viewQuiz();
  };
}

function fmt(ms){ const s=ms/1000; const m=Math.floor(s/60); const r=(s-m*60).toFixed(1); return m>0? `${m}분 ${r}초` : `${r}초`; }

function viewQuiz(){
  stopTick();
  const Q=S.quiz, i=Q.ans.length;
  if(i>=QUIZ.length){ Q.end=Date.now(); save(); return viewCert(); }
  const q=QUIZ[i];
  h(`<div class="top">${whoTag()}<span class="timer" id="tm">0.0초</span></div>
     <div class="card">
       <div class="steps">${QUIZ.map((_,k)=>`<span class="${k<=i?'on':''}"></span>`).join("")}</div>
       <p class="muted">최종 진단 ${i+1} / ${QUIZ.length}</p>
       <p class="q">${q.q}</p>
       <div class="opts">${Q.order[i].map((k,n)=>`<button class="opt" data-k="${k}">${"①②③④"[n]} ${q.opts[k][0]}</button>`).join("")}</div>
     </div>
     <p class="foot">고르면 바로 다음 문제로 넘어가요. 되돌아갈 수 없어요.</p>`);
  tick=setInterval(()=>{ const el=document.getElementById("tm"); if(el) el.textContent=fmt(Date.now()-Q.start); },100);
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ $app.querySelectorAll(".opt").forEach(x=>x.disabled=true); b.classList.add("sel"); Q.ans.push(+b.dataset.k); save(); setTimeout(viewQuiz,180); });
}

function viewCert(){
  stopTick();
  const Q=S.quiz; const score=Q.ans.filter((k,i)=>QUIZ[i].opts[k][1]===1).length; const el=Q.end-Q.start;
  const end=new Date(Q.end); const hhmm=end.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  h(`<div class="cert pop">
       <div class="big" style="width:110px;height:110px">${score===5?ICONS.trophy:ICONS.doctor}</div>
       <span class="tag">완료 증명서</span>
       <h2>${S.name?`${esc(S.name.ban)}반 ${esc(S.name.num)}번 ${esc(S.name.nm)}`:""}</h2>
       <div class="grid">
         <div class="box"><span class="muted">정답</span><span class="score">${score}<small style="font-size:1.4rem"> / 5</small></span></div>
         <div class="box"><span class="muted">걸린 시간</span><span class="time">${fmt(el)}</span></div>
       </div>
       <div class="stamps">${ROOMS.map(r=>`<span class="${S.done[r.id]?'on':''}">${r.name.replace(" 진료실","")}</span>`).join("")}${S.done.bonus?'<span class="on">보너스</span>':''}</div>
       <p class="muted">제출 시각 ${hhmm}</p>
       <span class="live" id="live">지금</span>
       <p>${score===5?"만점이에요! 선생님이 부르면 이 화면 그대로 보여 주세요.":"수고했어요! 틀린 문제는 정답 공개 때 확인해요."}</p>
     </div>
     <div class="row" style="justify-content:center"><button class="btn sec" id="rev">정답 확인 (선생님이 말하면)</button></div>
     <div id="review"></div>
     <p class="foot"><button class="linkish" id="reset">선생님 전용: 이 기기 초기화</button></p>`);
  const live=()=>{ const e=document.getElementById("live"); if(e) e.textContent="지금 "+new Date().toLocaleTimeString("ko-KR",{hour12:false}); };
  live(); tick=setInterval(live,1000);
  document.getElementById("rev").onclick=()=>{
    document.getElementById("review").innerHTML=`<div class="card">${QUIZ.map((q,i)=>{ const k=Q.ans[i], good=q.opts[k][1]===1, right=q.opts.find(o=>o[1]===1)[0];
      return `<div class="fb ${good?'ok':'no'}"><b>${i+1}. ${good?'정답':'오답'}</b> ${q.q}<br>정답: <b>${right}</b>${good?'':` · 내 답: ${q.opts[k][0]}`}<br><span class="muted">${q.why}</span></div>`; }).join("")}</div>`;
  };
  document.getElementById("reset").onclick=()=>askReset("review");
}
function askReset(boxId){
  const box=document.getElementById(boxId);
  box.innerHTML=`<div class="card"><label for="rc">초기화 코드 (다음 반이 쓰기 전에)</label><input id="rc" inputmode="numeric" maxlength="4"><button class="btn sec" id="rc-go">초기화</button><p id="rc-msg" class="muted"></p></div>`;
  document.getElementById("rc-go").onclick=()=>{ if(document.getElementById("rc").value.trim()===RESET_CODE){ S={name:null,done:{},quiz:null}; save(); viewStart(); } else document.getElementById("rc-msg").textContent="코드가 달라요."; };
}

/* ---------- 시작 ---------- */
if(!S.name) viewStart(); else viewHub();
</script>
</body></html>
